name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  RUST_TEST_THREADS: '1'
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            vscode-target: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            vscode-target: linux-arm64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            vscode-target: darwin-x64
          - os: macos-26
            target: aarch64-apple-darwin
            vscode-target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate version tag
        run: python3 scripts/release/package.py validate "$RELEASE_TAG"
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add "$RELEASE_TARGET"
          rustc --version --verbose
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: release-${{ matrix.target }}
          save-if: false
      - name: Check native code before packaging
        run: bash scripts/ci/check-native.sh
      - name: Configure static Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
          key="CARGO_TARGET_${RELEASE_TARGET^^}_LINKER"
          echo "${key//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build release executable
        run: cargo build --locked --release -p vizzi --target "$RELEASE_TARGET"
      - name: Ad-hoc sign macOS executable
        if: runner.os == 'macOS'
        run: codesign --force --sign - "target/$RELEASE_TARGET/release/vizzi"
      - name: Smoke-test the release executable
        run: |
          "target/$RELEASE_TARGET/release/vizzi" --help
          "target/$RELEASE_TARGET/release/vizzi" --once --workers 1 --root docs/tutorials/first-call-trail-ruby --cache "$RUNNER_TEMP/release-smoke-cache"
      - name: Create archive and checksum
        run: python3 scripts/release/package.py package "$RELEASE_TAG" "$RELEASE_TARGET" "target/$RELEASE_TARGET/release/vizzi" dist
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - name: Package bundled VS Code extension
        env:
          VSIX_TARGET: ${{ matrix.vscode-target }}
        run: python3 editors/vscode/package.py --binary "target/$RELEASE_TARGET/release/vizzi" --target "$VSIX_TARGET"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Release browser and tutorials
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.x'
      - uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: ruby
      - run: npm ci
      - run: node_modules/.bin/playwright install --with-deps chromium
      - run: cargo build --locked --release -p vizzi
      - run: npm run test:editor
      - run: npm test -- --no-build
      - run: node_modules/node/bin/node experiments/browser/documentation.test.mjs --no-build
      - name: Release helper checks
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'

  publish:
    name: Publish immutable release
    needs: [build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Validate complete release bundle
        run: python3 scripts/release/package.py bundle "$RELEASE_TAG" dist
      - name: Publish all assets together
        run: bash scripts/release/publish.sh
