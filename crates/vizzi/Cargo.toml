[package]
name = "vizzi"
version = "0.1.0"
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
toml = { workspace = true, features = ["display"] }
url.workspace = true
vizzi-search = { path = "../vizzi-search" }
vizzi-core = { path = "../vizzi-core" }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jsonc-parser.workspace = true
shlex.workspace = true
notify.workspace = true
tempfile.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
futures-util.workspace = true
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[dev-dependencies]
http-body-util.workspace = true

[features]
qualification = []

[[example]]
name = "qualify"
required-features = ["qualification"]

[[example]]
name = "retain"
required-features = ["qualification"]

[[example]]
name = "working_set"
required-features = ["qualification"]

[[example]]
name = "admit"
required-features = ["qualification"]

[[example]]
name = "source_storage"
required-features = ["qualification"]

[[example]]
name = "stream_capture"
required-features = ["qualification"]

[[example]]
name = "foreground_maintenance"
required-features = ["qualification"]

[[example]]
name = "idle_maintenance"
required-features = ["qualification"]
