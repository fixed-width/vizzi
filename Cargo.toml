[workspace]
members = ["crates/vizzi-perf", "crates/vizzi-core", "crates/vizzi", "crates/vizzi-qa"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
blake3 = { version = "1.8.7", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
wgpu = "30.0.1"
pollster = "1.0.1"
notify = "8.2.1"
thiserror = "2.0.21"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = { version = "0.4.3", features = ["std"] }
