[workspace]
members = ["crates/vizzi-perf"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.dependencies]
blake3 = { version = "1.8.7", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
wgpu = "30.0.1"
pollster = "1.0.1"
notify = "8.2.1"
thiserror = "2.0.21"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
